name: .NET Tests

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore DryCleaning/DryCleaning.sln

    - name: Build
      run: dotnet build DryCleaning/DryCleaning.sln --no-restore

    - name: Test
      run: dotnet test DryCleaning/DryCleaning.sln --no-build --verbosity normal