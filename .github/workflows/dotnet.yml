name: .NET Tests

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore XumChustka/XumChustka.sln

    - name: Build
      run: dotnet build XumChustka/XumChustka.sln --no-restore

    - name: Test
      run: dotnet test XumChustka/XumChustka.sln --no-build --verbosity normal